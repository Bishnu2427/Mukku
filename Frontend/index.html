<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/static/mukku_logo.png" />
    <link rel="apple-touch-icon" href="/static/mukku_logo.png" />

    <!-- Primary SEO (landing). Per-route overrides happen in <Seo/>. -->
    <title>Mukku AI Studio — Turn Any Text Into a Finished Video</title>
    <meta name="description" content="Mukku AI Studio is an AI video generator that turns any text prompt into a fully produced MP4. An 8-stage pipeline, 12 Indian and global languages, and presets for YouTube, Shorts, Reels and TikTok. No editing skills needed." />
    <meta name="keywords" content="AI video generator, text to video, free AI video maker, Indian language video generator, YouTube Shorts AI, Reels AI creator, Mukku AI, Hindi video AI, Telugu video AI" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Mukku AI Studio" />
    <meta name="theme-color" content="#10131f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://mukku.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mukku AI Studio" />
    <meta property="og:url" content="https://mukku.ai/" />
    <meta property="og:title" content="Mukku AI Studio — Turn Any Text Into a Finished Video" />
    <meta property="og:description" content="Type your idea. Get a fully produced MP4 in minutes — script, visuals, voiceover and music, generated end to end." />
    <meta property="og:image" content="https://mukku.ai/static/mukku_logo.png" />
    <meta property="og:image:alt" content="Mukku AI Studio — Text to Video Generator" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mukkuai" />
    <meta name="twitter:creator" content="@mukkuai" />
    <meta name="twitter:title" content="Mukku AI Studio — Text to Video in Minutes" />
    <meta name="twitter:description" content="Type your idea. Get a fully produced MP4 — script, voiceover, AI visuals and music. 12 languages." />
    <meta name="twitter:image" content="https://mukku.ai/static/mukku_logo.png" />

    <!-- Fonts: Geist display, Inter body, JetBrains Mono technical labels -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Applies the saved theme before first paint. External (not inline) so
         the CSP can forbid inline scripts outright — see backend/app.py. -->
    <script src="/static/theme-init.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Mukku AI Studio",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web Browser",
        "url": "https://mukku.ai/",
        "description": "Mukku AI Studio converts any text prompt into a fully produced MP4 video using an 8-stage AI pipeline. Supports 12 languages including Hindi, Telugu, Tamil and Bengali, with 7 platform presets.",
        "screenshot": "https://mukku.ai/static/mukku_logo.png",
        "softwareVersion": "3.0",
        "offers": [
          { "@type": "Offer", "name": "Free Plan", "price": "0", "priceCurrency": "INR", "description": "3 AI videos per month, all core features included" },
          { "@type": "Offer", "name": "Starter Plan", "price": "177", "priceCurrency": "INR", "description": "5 AI videos per month" },
          { "@type": "Offer", "name": "Pro Plan", "price": "577", "priceCurrency": "INR", "description": "25 AI videos per month" }
        ],
        "featureList": [
          "AI script generation from text prompt",
          "AI voiceover in 12 languages",
          "Automated scene planning",
          "AI image generation per scene",
          "AI video clip animation",
          "AI background music generation",
          "Custom media upload support",
          "7 platform presets",
          "Two-factor secure authentication",
          "Personal video library and dashboard"
        ],
        "inLanguage": ["en","hi","te","ta","bn","mr","gu","kn","ml","pa","or","as"],
        "creator": { "@type": "Organization", "name": "Mukku AI", "url": "https://mukku.ai/" }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "What is Mukku AI Studio?", "acceptedAnswer": { "@type": "Answer", "text": "Mukku AI Studio is an online AI video generator that converts any text prompt into a fully produced MP4 video. It runs an 8-stage pipeline: prompt analysis, script writing, scene planning, image generation, clip animation, voiceover, music and final assembly." } },
          { "@type": "Question", "name": "Which languages does Mukku AI Studio support?", "acceptedAnswer": { "@type": "Answer", "text": "Twelve languages: English, Hindi, Bengali, Telugu, Marathi, Tamil, Gujarati, Kannada, Malayalam, Punjabi, Odia and Assamese." } },
          { "@type": "Question", "name": "Is Mukku AI Studio free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. The Free plan includes 3 AI videos per month with no credit card required. Paid plans start at Rs 177 per month for 5 videos and Rs 577 per month for 25 videos." } },
          { "@type": "Question", "name": "What platforms can I create videos for?", "acceptedAnswer": { "@type": "Answer", "text": "Presets cover YouTube, YouTube Shorts, Instagram Reels, Instagram Post, TikTok, LinkedIn and X. Each preset sets aspect ratio, duration, tone and visual style automatically." } },
          { "@type": "Question", "name": "How long does it take to generate a video?", "acceptedAnswer": { "@type": "Answer", "text": "A one-minute video typically takes 3 to 8 minutes depending on load. Longer videos of three to five minutes can take 10 to 20 minutes." } }
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Mukku AI",
        "url": "https://mukku.ai/",
        "logo": "https://mukku.ai/static/mukku_logo.png",
        "sameAs": [],
        "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "url": "https://mukku.ai/#contact" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Mukku AI Studio needs JavaScript enabled to run.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
